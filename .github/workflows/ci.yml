name: notebook
on: [push, pull_request, workflow_dispatch]
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Tests (sanitizers; performance tests run locally only)
        run: python3 test.py --no-perf
      - name: Build PDF
        run: python3 build.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: notebook
          path: notebook.pdf
